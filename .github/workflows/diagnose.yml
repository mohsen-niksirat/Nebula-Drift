name: Diagnose import crash

# Bisects the `godot --headless --import` SIGSEGV by isolating project
# pieces one at a time. Informational only — the deploy workflow remains
# the gate. Results appear in the Actions log.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bisect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 headless
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q "Godot_v4.3-stable_linux.x86_64.zip"
          sudo mv "Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Bisect the import crash
        run: |
          mkdir -p /tmp/diag
          run_import() {
            local label="$1"; shift
            rm -rf .godot
            if godot --headless "$@" > /tmp/diag/out.txt 2>&1; then
              echo "=== [$label] PASS ==="
            else
              echo "=== [$label] FAIL (exit $?) ==="
              tail -30 /tmp/diag/out.txt || true
            fi
          }

          echo "##### TEST 1: minimal project.godot (environmental check)"
          cp project.godot /tmp/diag/project.godot.bak
          printf 'config_version=5\n\n[application]\n\nconfig/name="diag"\n' > project.godot
          run_import "minimal-project" --import
          cp /tmp/diag/project.godot.bak project.godot

          echo "##### TEST 2: full import, verbose (last ops before crash)"
          run_import "full-verbose" --import --verbose

          echo "##### TEST 3: import without icon.svg"
          mv icon.svg /tmp/diag/icon.svg.bak
          run_import "no-icon" --import
          mv /tmp/diag/icon.svg.bak icon.svg

          echo "##### TEST 4: import without export_presets.cfg"
          mv export_presets.cfg /tmp/diag/presets.bak
          run_import "no-presets" --import
          mv /tmp/diag/presets.bak export_presets.cfg

          echo "##### TEST 5: import without autoloads"
          cp project.godot /tmp/diag/pg.bak
          python3 - <<'PYEOF'
          lines = open('project.godot').read().splitlines(keepends=True)
          out, skip = [], False
          for ln in lines:
              if ln.startswith('[autoload]'):
                  skip = True
                  continue
              if skip and ln.startswith('['):
                  skip = False
              if not skip:
                  out.append(ln)
          open('project.godot', 'w').write(''.join(out))
          PYEOF
          run_import "no-autoloads" --import
          cp /tmp/diag/pg.bak project.godot

          echo "##### TEST 6: import without scenes/ (scripts only)"
          mv scenes /tmp/diag/scenes.bak
          run_import "no-scenes" --import
          mv /tmp/diag/scenes.bak scenes

          echo "##### TEST 7: alternative command --editor --quit"
          run_import "editor-quit" --editor --quit

          echo "##### TEST 8: Godot 4.4 differential"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip" \
            && unzip -q "Godot_v4.4-stable_linux.x86_64.zip" \
            && rm -rf .godot \
            && (./Godot_v4.4-stable_linux.x86_64 --headless --import > /tmp/diag/out44.txt 2>&1 \
                && echo "=== [godot-4.4] PASS ===" \
                || { echo "=== [godot-4.4] FAIL (exit $?) ==="; tail -30 /tmp/diag/out44.txt; }) \
            || echo "=== [godot-4.4] download failed, skipped ==="

          echo "##### BISECTION COMPLETE"
